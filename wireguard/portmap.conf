# FamilyNetwork - public port map
# ---------------------------------------------------------------------------
# One line = one public port (or port range) that the VPS forwards down the
# WireGuard tunnel to a machine at home. Edit this file, re-run
# vps-apply-portmap.sh, done. Nothing on Danny's router is ever involved.
#
# Columns (whitespace separated):
#   name        label, for logs and `nft list` comments. No spaces.
#   proto       tcp | udp
#   public      port or range on the VPS's public IP  (e.g. 25569 or 25560-25579)
#   target      host alias from the peer table below, or a literal 10.8.0.x
#   dport       port or range on the target. Must be the same WIDTH as `public`.
#   enabled     yes | no   ("no" keeps the line as documentation, drops the rule)
#
# Peer aliases (see wireguard/README.md - keep in sync with the WG configs):
#   romulus  = 10.8.0.2      remoria = 10.8.0.3      bubba = 10.8.0.4
#
# RANGES: prefer a range over per-server lines. A range means adding a new
# Minecraft world is a LOCAL change only - bind it to a free port inside the
# range and it is instantly public. No VPS edit, no re-apply, no downtime.
#
# name              proto  public         target    dport          enabled
# ---------------------------------------------------------------------------

# --- Minecraft: Java servers ------------------------------------------------
# 20 ports reserved. Already live and referenced by installers in MCServers:
#   25568 = superflat            (docs/superflat/install.ps1)
#   25569 = normal-survival      (docs/install.ps1)
# Do not renumber those two without updating the installers + index.html.
minecraft-java      tcp    25560-25579    romulus   25560-25579    yes

# --- Minecraft: Simple Voice Chat -------------------------------------------
# UDP, one port per server, default 24454. Range matched to the Java range so
# a new world gets voice with no VPS change. Set voice_chat.port in each
# server's config/voicechat/voicechat-server.properties.
minecraft-voice     udp    24450-24469    romulus   24450-24469    yes

# --- Minecraft: Bedrock / Geyser --------------------------------------------
# Geyser Standalone listens UDP 19132 (normal-survival/CLAUDE.md).
geyser-bedrock      udp    19132          romulus   19132          yes

# --- Jellyfin ---------------------------------------------------------------
# Exposed via the reverse proxy on 443 instead of raw 8096 - see README
# "Websites, API and Jellyfin". Flip to yes only if you want the raw port out.
jellyfin-direct     tcp    8096           romulus   8096           no

# --- Websites + API ---------------------------------------------------------
# Terminates at a reverse proxy at home, which routes by hostname. That is what
# lets "two websites and an API" share one public port pair.
# NOTE: datakiin.com / play.datakiin.com / api.datakiin.com currently resolve to
# Cloudflare, not to home. Only enable these once you have moved those records
# (or set Cloudflare origin) to the VPS. See README "DNS cutover".
web-http            tcp    80             romulus   80             no
web-https           tcp    443            romulus   443            no

# --- SSH --------------------------------------------------------------------
# DELIBERATELY DISABLED. Do not publish port 22 to the internet. The tunnel is
# itself the admin path: from anywhere, WireGuard up, then `ssh 10.8.0.2`.
# That is strictly less exposure than a public SSH port, and it matches the
# "least privilege / least exposure" rule in CLAUDE.md.
ssh-romulus         tcp    22             romulus   22             no
