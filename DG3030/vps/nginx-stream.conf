# Public TCP 443 -> labserver's Caddy, over WireGuard.
#
# Installed to /etc/nginx/stream.d/datakiin.conf by setup-vps.sh.
#
# THIS PROXY NEVER DECRYPTS ANYTHING. It is a TCP forwarder: TLS terminates on
# labserver, so the certificate and private key never exist on this rented box
# and the provider relays ciphertext it cannot read. That is the single most
# important property of this file -- do not "improve" it into an HTTPS reverse
# proxy with its own certificate, which would silently move family video and
# private files into plaintext on a machine we rent by the month.

upstream labserver_https {
    server 10.10.0.2:443;
}

server {
    listen 443;
    proxy_pass labserver_https;

    # PROXY protocol carries the ORIGINAL client address to Caddy. Without it
    # Caddy sees 10.10.0.1 for every request, so Jellyfin files every remote
    # viewer as "local" and applies no bitrate limit, and Nextcloud counts all
    # failed logins against one IP until it locks out the internet.
    # Caddy must have a matching listener_wrappers/proxy_protocol block with
    # `allow 10.10.0.1/32`, or it will reject these connections.
    proxy_protocol on;

    # Multi-GB uploads run for hours. The default 10 minute idle timeout would
    # cut a large transfer mid-flight and look like a client problem.
    proxy_timeout         1h;
    proxy_connect_timeout 5s;
}

# NOTE: no `listen 443 udp;` block, deliberately.
#
# HTTP/3 rides UDP 443 and does not survive a naive stream proxy -- QUIC does
# its own congestion control and connection migration, and PROXY protocol has
# no standard UDP form here. Clients that try h3 will fail and fall back to
# TCP, which works but costs a first-connection delay.
#
# So turn h3 OFF in Caddy to match, rather than advertising something that
# cannot work:
#
#     {
#         servers {
#             protocols h1 h2
#         }
#     }
#
# MTU footnote: because nginx PROXIES (terminates one TCP connection and opens
# another) rather than ROUTES, the kernel sizes the tunnel-side segments from
# wg0's own MTU. That sidesteps the path-MTU black holes that plague routed
# WireGuard setups -- no MSS clamping needed.
